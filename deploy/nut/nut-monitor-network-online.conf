# nut-monitor.service drop-in — order upsmon after the network is actually up.
#
# The vendor nut-monitor.service orders itself `After=network.target`, which
# only means "the network stack is configured", NOT "an address is assigned and
# routable". On a secondary (mt/spark) that races upsmon against DHCP/link-up:
# upsmon starts, can't reach cyberpower@192.168.1.125 yet, and logs a spurious
# comm-loss until the network settles (RESEARCH.md §3).
#
# This drop-in adds `network-online.target` ordering without editing the vendor
# unit (survives package upgrades). Apply on each SECONDARY:
#
#     sudo systemctl edit nut-monitor
#     # paste the [Unit] stanza below, save, then:
#     sudo systemctl daemon-reload
#
# (Requires NetworkManager-wait-online / systemd-networkd-wait-online enabled so
# network-online.target is actually reached.)

[Unit]
After=network-online.target
Wants=network-online.target
