# crowdsec-firewall-bouncer systemd drop-in — the PERMANENT guard against
# nftables reloads silently disarming crowdsec.
#
# Why this exists: Debian's /etc/nftables.conf begins with `flush ruleset`,
# which wipes crowdsec's `crowdsec`/`crowdsec6` tables. The bouncer does NOT
# auto-recreate them on a plain `nft -f` — only a bouncer restart does. Without
# a guard, every future `systemctl reload nftables` (or a manual `nft -f`) leaves
# the box unprotected until someone remembers to bounce the bouncer
# (RESEARCH.md §4, Correction #3).
#
# `PartOf=nftables.service` makes systemd restart the bouncer automatically
# whenever nftables is restarted, so the crowdsec tables are recreated every
# time the ruleset is reloaded through systemd.
#
# The operator applies this ONCE, by hand (it edits a vendor unit's drop-in dir):
#
#     sudo systemctl edit crowdsec-firewall-bouncer
#     # paste the [Unit] stanza below, save, then:
#     sudo systemctl daemon-reload
#
# NOTE: this guards the systemd path. `monitor add` still does an explicit
# `systemctl restart crowdsec-firewall-bouncer` after its own `nft -f`, because a
# direct `nft -f` does not go through nftables.service and so does not trigger
# PartOf. Both together are belt-and-braces (RESEARCH.md §4).

[Unit]
PartOf=nftables.service
