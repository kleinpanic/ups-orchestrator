[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ups-orchestrator"
version = "0.4.0"
description = "NUT-driven UPS power-event monitor that reports per-UPS status to Discord and shuts the host down on low battery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "klein" }]
keywords = ["nut", "ups", "discord", "monitoring", "homelab"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]
# Runtime is intentionally dependency-free: Discord delivery uses stdlib urllib,
# UPS data comes from the `upsc` CLI shipped with NUT.
dependencies = []

[project.urls]
Homepage = "https://github.com/kleinpanic/ups-orchestrator"
Repository = "https://github.com/kleinpanic/ups-orchestrator"
Changelog = "https://github.com/kleinpanic/ups-orchestrator/blob/main/CHANGELOG.md"
Issues = "https://github.com/kleinpanic/ups-orchestrator/issues"
Documentation = "https://github.com/kleinpanic/ups-orchestrator/wiki"

[project.scripts]
ups-orchestrator = "ups_orchestrator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
dashboard = ["matplotlib>=3.7"]
docs = ["mkdocs-material>=9.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/ups_orchestrator"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# webui.py embeds a single-page HTML/JS dashboard as a string literal; its lines
# are intentionally long (compact JS) and must not be reflowed.
"src/ups_orchestrator/webui.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# `make type` failed on an untouched tree: mypy PARSES the stubs of installed
# packages before deciding to skip them, and a current numpy's `__init__.pyi`
# uses PEP 695 `type` statements, which the 3.11 target rejects as a syntax
# error — "errors prevented further checking", so nothing was checked at all.
#
# numpy is not a dependency of this project. Runtime deps are empty by design
# (stdlib only), and numpy arrives solely as a transitive dep of the OPTIONAL
# `dashboard` extra. So the fix is neither to pin numpy — which would constrain
# every real install to placate a dev tool — nor to raise `python_version`, which
# would silently drop the 3.11 support floor that `requires-python` claims and the
# classifiers advertise. It is to stop mypy consulting site-packages for typing at
# all, which for a stdlib-only package costs nothing.
no_site_packages = true

# matplotlib is an optional runtime dep (power-dashboard only) and ships no
# typed stubs; skip it and its numpy backend rather than fail strict checking.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  # LO-C3: the `no_real_processes` autouse tripwire in tests/conftest.py refuses
  # every process spawn. A test that genuinely needs one opts out with this marker
  # and says why in a comment — it is not a way to silence an escape.
  "allow_subprocess: this test must reach a real process (state its reason)",
]

[tool.coverage.run]
branch = true
source = ["ups_orchestrator"]

[tool.coverage.report]
# dashboard.render_png needs matplotlib (optional), so exclude it from the floor.
omit = ["*/dashboard.py"]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
fail_under = 85
