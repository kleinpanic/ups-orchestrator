version: 2
updates:
  # Keep GitHub Actions pinned versions current (security + deprecations).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Dev/optional Python deps (runtime is stdlib-only, so this only touches extras).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
