name: Wiki Sync

# Mirrors docs/ into the GitHub wiki on every push to main. The wiki must be
# initialised once (create any page in the UI, or push to <repo>.wiki.git) for
# the remote to exist; until then this job no-ops.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/wiki-sync.yml"

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/ to the wiki
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"
          if ! git clone "$url" wiki 2>/dev/null; then
            echo "Wiki not initialised yet — create the first page once, then re-run."
            exit 0
          fi
          rm -f wiki/*.md
          cp docs/*.md wiki/
          cd wiki
          git add -A
          git diff --staged --quiet || git commit -m "docs: sync from ${{ github.sha }}"
          git push
