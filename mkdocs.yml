site_name: ups-orchestrator
site_description: NUT-driven multi-UPS power-event monitor with Discord embeds
site_url: https://kleinpanic.github.io/ups-orchestrator/
repo_url: https://github.com/kleinpanic/ups-orchestrator
repo_name: kleinpanic/ups-orchestrator
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Architecture: Architecture.md
  - Configuration: Configuration.md
  - Shutdown targets: Shutdown-Targets.md
  - Deployment: Deployment.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
